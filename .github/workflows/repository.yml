name: 仓库基础检查
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: repository-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  repository:
    name: 仓库基础检查
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 获取仓库文件
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: 检查资料边界、冲突标记与文档链接
        run: python3 scripts/check_repository.py
      - name: 验证演示看板的日期、任务与交付统计
        run: node --test tests/dashboard-model.test.cjs
