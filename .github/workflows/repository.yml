name: 仓库基础检查
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: repository-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  repository:
    name: 仓库基础检查
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: 检查资料边界、冲突标记与文档链接
        run: python3 scripts/check_repository.py
