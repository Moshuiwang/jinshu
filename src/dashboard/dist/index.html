<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="四达传媒智能编单系统：按播出日期展示编号工作流与人机交接。虚构数据演示。">
  <title>四达传媒智能编单系统 · 播出准备</title>
  <link rel="icon" href="assets/jinshu-mark.png">
  <link rel="stylesheet" href="styles.css">
  <script src="model.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
<div id="screen-shell"><main class="wallboard" id="dashboard">
  <header class="masthead">
    <div class="corporate"><img src="assets/startimes-logo.png" alt="StarTimes"><span>四达传媒</span></div>
    <span class="brand-divider"></span><img class="system-mark" src="assets/jinshu-mark.png" alt="锦书系统标识">
    <div class="brand"><h1>四达传媒智能编单系统</h1><span>v0.2 · 演示版</span></div>
    <nav class="date-tabs" aria-label="按播出日期查看"><button type="button" disabled title="汇总页面后续设计" class="summary-tab">汇总</button><div id="day-tabs"></div></nav>
    <button id="rotation" class="quiet-button rotation" type="button" aria-pressed="true"><span aria-hidden="true">⟳</span><span id="rotation-label">自动切换</span></button>
    <div class="clock"><time id="clock">--:--:--</time><div><span id="date"></span><span class="demo">演示数据</span></div></div>
    <div class="view-controls"><button id="theme" class="icon-button" type="button" aria-label="切换到深色背景" title="深浅背景">☾</button><button id="motion" class="icon-button" type="button" aria-label="暂停动效" aria-pressed="false" title="暂停动效">Ⅱ</button></div>
  </header>
  <section class="context" aria-label="所选播出日概况"><h2 id="page-title">明日播出准备</h2><span id="broadcast-date"></span><span id="channel-count"></span><span class="delivery"><b id="accepted-count">—</b><span id="total-count">/ 20</span><small>Playbox 已接收</small></span><span class="attention" id="attention"></span><span class="connection" id="connection">模拟状态已连接</span></section>
  <section class="workflow" id="workflow" aria-label="共享 Agent 与人工交接工作流"><svg id="flow-lines" class="flow-lines" aria-label="当前频道流线"></svg><div id="stages" class="stages"></div></section>
  <section class="support" aria-label="状态图例与优化反馈"><div class="state-key" id="state-key"></div><div class="feedback"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3H5v18h14V8ZM14 3v5h5M9 12h6M9 16h4"/></svg><span>回读与对比</span><span id="feedback"></span><small>不影响交付</small></div></section>
  <section class="channel-legend" aria-label="频道编号与名称图例" id="channel-legend"></section>
  <footer><span>虚构频道与模拟任务 · 编号样式 C · 单点沿线</span><span id="latest-event"></span><span id="updated"></span></footer>
</main></div>
<noscript>请启用 JavaScript 查看模拟工作流。</noscript>
</body>
</html>
